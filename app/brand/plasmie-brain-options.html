<title>Plasmie Brain Options</title>
<style>
:root{--ground:#FDF1F4;--surface:#FFF9FA;--ink:#3A1430;--ink-2:#6A3A5A;--rule:#F3D6DF;--rule-strong:#E8B4C4;--accent:#3A1430;--accent-soft:#FBE1E9;
--display:"Baloo 2","Arial Rounded MT Bold",ui-rounded,sans-serif;--text:"Hanken Grotesk",ui-sans-serif,system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ground:#1E1218;--surface:#2A1922;--ink:#FBE9EF;--ink-2:#E7C3D0;--rule:#43273A;--rule-strong:#63384F;--accent:#FBE9EF;--accent-soft:#3D2232;color-scheme:dark}}
:root[data-theme="dark"]{--ground:#1E1218;--surface:#2A1922;--ink:#FBE9EF;--ink-2:#E7C3D0;--rule:#43273A;--rule-strong:#63384F;--accent:#FBE9EF;--accent-soft:#3D2232;color-scheme:dark}
body{background:var(--ground);color:var(--ink);font:400 16px/1.5 var(--text)}
main{max-width:1080px;margin:0 auto;padding-inline:clamp(16px,4vw,40px);padding-block:40px 64px;display:grid;gap:22px}
h1{font:800 clamp(2rem,5vw,3.2rem)/1 var(--display);margin:0}
.lede{color:var(--ink-2);max-width:60ch;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:16px}
.opt{margin:0;background:var(--surface);border:1px solid var(--rule);border-radius:20px;padding:16px;display:grid;gap:10px;position:relative;min-width:0}
.opt svg{width:100%;max-width:220px;justify-self:center;aspect-ratio:1}
.tag{position:absolute;top:12px;left:14px;font:800 1.1rem/1 var(--display);color:var(--ink-2)}
.opt b{font:700 1.15rem/1.2 var(--display)}
.opt p{margin:4px 0 0;color:var(--ink-2);font-size:.94rem}
.small{display:flex;gap:18px;align-items:center;flex-wrap:wrap;color:var(--ink-2);font-size:.9rem}
.small svg{width:22px;height:22px}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Hanken+Grotesk:wght@400;600&display=swap">
<!-- Light/Dark/Auto switcher. Drop just inside <body>.
     Requires the page's dark vars under BOTH:
       @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { ... } }
       :root[data-theme="dark"] { ... }
     Runs inline (not on DOMContentLoaded) so the stored theme lands before first paint. -->
<style>
.theme{position:fixed;top:12px;right:12px;z-index:50;display:flex;
  border:1px solid var(--rule-strong,#999);border-radius:3px;overflow:hidden;
  background:var(--surface,#fff);opacity:.72;transition:opacity .15s}
.theme:hover,.theme:focus-within{opacity:1}
.theme button{appearance:none;border:0;background:none;cursor:pointer;
  font:500 .62rem/1 var(--mono,ui-monospace,monospace);letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-3,#777);padding:6px 9px}
.theme button+button{border-left:1px solid var(--rule,#ddd)}
.theme button:hover{color:var(--ink,#111)}
.theme button[aria-pressed="true"]{background:var(--accent-soft,#eee);color:var(--accent,#111)}
@media print{.theme{display:none}}
</style>
<div class="theme" role="group" aria-label="Colour theme">
  <button type="button" data-theme-set="light">Light</button>
  <button type="button" data-theme-set="dark">Dark</button>
  <button type="button" data-theme-set="system">Auto</button>
</div>
<script>
(function () {
  var root = document.documentElement, KEY = 'artifact-theme';
  var btns = document.querySelectorAll('[data-theme-set]');
  function apply(t) {
    if (t === 'system') { root.removeAttribute('data-theme'); root.style.colorScheme = 'light dark'; }
    else { root.setAttribute('data-theme', t); root.style.colorScheme = t; }
    Array.prototype.forEach.call(btns, function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-theme-set') === t ? 'true' : 'false');
    });
  }
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}          // private window / blocked storage
  apply(saved === 'light' || saved === 'dark' ? saved : 'system');
  Array.prototype.forEach.call(btns, function (b) {
    b.addEventListener('click', function () {
      var t = b.getAttribute('data-theme-set');
      try { localStorage.setItem(KEY, t); } catch (e) {}
      apply(t);
    });
  });
})();
</script>
